name: Build ChargingHub

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "镜像标签，例如 v1"
        required: true
        default: "v1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jshmcz/charginghub:${{ github.event.inputs.image_tag }}
            ghcr.io/jshmcz/charginghub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
